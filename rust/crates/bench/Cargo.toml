[package]
name = "syncular-bench"
version = "0.1.0"
edition = "2021"
description = "Private benchmark driver with shipping socket transport and an in-process engine host"
license = "UNLICENSED"
publish = false

[lib]
name = "syncular_bench"
crate-type = ["rlib", "cdylib"]

[[bin]]
name = "syncular-bench"
path = "src/main.rs"

[dependencies]
syncular-client = { path = "../client", features = ["bench-internals"] }
rusqlite = { version = "0.32", features = ["bundled", "trace", "hooks"] }
syncular-command = { path = "../command" }
# The bench driver measures the SHIPPING native lane: the same HTTP+WS
# transport the FFI core owns (ureq + tungstenite), reused rather than copied.
syncular-ffi = { path = "../ffi", features = ["native-transport", "bench-internals"] }
serde_json = "1"
sha2 = "0.10"
ssp2 = { package = "syncular-ssp2", path = "../ssp2" }
