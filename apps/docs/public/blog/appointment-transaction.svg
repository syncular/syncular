<svg xmlns="http://www.w3.org/2000/svg" width="480" height="660" viewBox="0 0 480 660" role="img" aria-labelledby="title desc">
  <title id="title">From the local outbox to a durable server reaction</title>
  <desc id="desc">The device saves rows and an outbox entry locally. On reconnect, one server transaction saves application rows, pending reaction work, the commit log, and the idempotency result. Only after commit does a worker call the notification provider.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="m 1 1 8 4 -8 4" fill="none" stroke="#ffb000" stroke-width="1.5"/></marker>
  </defs>
  <rect width="480" height="660" fill="#0a0908"/>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#f4efe4">
    <text x="24" y="34" fill="#ffb000" font-size="14" letter-spacing="1">01 / FOLLOW THE WRITE</text>
    <rect x="24" y="56" width="432" height="78" fill="#14120e" stroke="#756f64"/>
    <text x="42" y="86" font-size="19">Device · local transaction</text>
    <text x="42" y="114" font-size="17" fill="#b9b2a6">Updated rows + outbox entry</text>
    <path d="M 240 134 V 194" fill="none" stroke="#ffb000" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="258" y="172" font-size="15" fill="#b9b2a6">Reconnect + push</text>
    <rect x="24" y="204" width="432" height="270" fill="#14120e" stroke="#ffb000" stroke-width="1.5"/>
    <text x="42" y="236" font-size="19" fill="#ffb000">One server transaction</text>
    <text x="42" y="265" font-size="16" fill="#b9b2a6">Authorize → validate → plan</text>
    <path d="M 42 283 H 438" stroke="#756f64"/>
    <text x="42" y="315" font-size="18">Appointment + reservation</text>
    <text x="42" y="349" font-size="18">Reschedule event</text>
    <text x="42" y="383" font-size="18" fill="#ffb000">Pending notification reaction</text>
    <text x="42" y="417" font-size="18">Commit log + idempotency result</text>
    <text x="42" y="452" font-size="15" fill="#b9b2a6">All commit together or roll back.</text>
    <path d="M 240 474 V 538" fill="none" stroke="#ffb000" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="258" y="513" font-size="15" fill="#ffb000">COMMITTED</text>
    <rect x="24" y="548" width="432" height="88" fill="#14120e" stroke="#756f64"/>
    <text x="42" y="580" font-size="19">Worker claims the reaction</text>
    <text x="42" y="610" font-size="17" fill="#b9b2a6">Then calls the provider</text>
  </g>
</svg>
