"$schema" = "schemas/schema.json"

[default]
description = """
Allows the webview to drive the native syncular client: the one command
surface (syncular_command) and the query paths (syncular_query and the atomic
syncular_query_snapshot sidecar). Grant this to the window(s) that host
your syncular-backed UI.
"""
permissions = [
  "allow-syncular-command",
  "allow-syncular-query",
  "allow-syncular-query-snapshot",
]
